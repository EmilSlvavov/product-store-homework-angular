<span class="stars" [class.interactive]="!readonly()" (mouseleave)="onLeave()">
  @for (star of stars; track star) {
    <span
      class="star"
      [class.filled]="isFilled(star)"
      (mouseenter)="onEnter(star)"
      (click)="onStarClick(star)">★</span>
  }
</span>
<span class="rating-meta">{{ rating() }} ({{ reviewCount() }})</span>
